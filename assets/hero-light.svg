<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Six questions and how much of the evidence behind them was measured on people">
<rect width="960" height="480" fill="#ffffff"/>
<text x="24" y="40" font-size="22" font-weight="700" fill="#1f2328">Six questions. Almost nothing here was measured on people</text>
<rect x="24" y="64" width="293" height="190" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="24" y="64" width="4" height="190" rx="2" fill="#0969da"/>
<text x="42" y="92" font-size="12" font-weight="700" fill="#0969da" letter-spacing="0.6">MAPS</text>
<text x="42" y="120" font-size="17" font-weight="700" fill="#1f2328">How does this app</text>
<text x="42" y="142" font-size="17" font-weight="700" fill="#1f2328">fit together</text>
<text x="42" y="190" font-size="30" font-weight="700" fill="#1f2328">9 tools</text>
<line x1="42" y1="208" x2="299" y2="208" stroke="#d8dee4"/>
<text x="42" y="234" font-size="14" fill="#59636e">0 measured on people</text>
<rect x="333" y="64" width="293" height="190" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="333" y="64" width="4" height="190" rx="2" fill="#8250df"/>
<text x="351" y="92" font-size="12" font-weight="700" fill="#8250df" letter-spacing="0.6">WIKIS</text>
<text x="351" y="120" font-size="17" font-weight="700" fill="#1f2328">Ask the codebase</text>
<text x="351" y="190" font-size="30" font-weight="700" fill="#1f2328">5 tools</text>
<line x1="351" y1="208" x2="608" y2="208" stroke="#d8dee4"/>
<text x="351" y="234" font-size="14" fill="#59636e">0 on people, 1 graded by a model</text>
<rect x="642" y="64" width="293" height="190" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="642" y="64" width="4" height="190" rx="2" fill="#bc4c00"/>
<text x="660" y="92" font-size="12" font-weight="700" fill="#bc4c00" letter-spacing="0.6">PULL REQUESTS</text>
<text x="660" y="120" font-size="17" font-weight="700" fill="#1f2328">What did the agent</text>
<text x="660" y="142" font-size="17" font-weight="700" fill="#1f2328">just change</text>
<text x="660" y="190" font-size="30" font-weight="700" fill="#1f2328">10 tools</text>
<line x1="660" y1="208" x2="917" y2="208" stroke="#d8dee4"/>
<text x="660" y="234" font-size="14" fill="#59636e">0 measured on people</text>
<rect x="24" y="270" width="293" height="190" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="24" y="270" width="4" height="190" rx="2" fill="#cf222e"/>
<text x="42" y="298" font-size="12" font-weight="700" fill="#cf222e" letter-spacing="0.6">IMPACT</text>
<text x="42" y="326" font-size="17" font-weight="700" fill="#1f2328">What breaks if</text>
<text x="42" y="348" font-size="17" font-weight="700" fill="#1f2328">I change this</text>
<text x="42" y="396" font-size="30" font-weight="700" fill="#1f2328">4 tools</text>
<line x1="42" y1="414" x2="299" y2="414" stroke="#d8dee4"/>
<text x="42" y="440" font-size="14" fill="#59636e">0 on people, 1 on agents</text>
<rect x="333" y="270" width="293" height="190" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="333" y="270" width="4" height="190" rx="2" fill="#1a7f37"/>
<text x="351" y="298" font-size="12" font-weight="700" fill="#1a7f37" letter-spacing="0.6">YOU</text>
<text x="351" y="326" font-size="17" font-weight="700" fill="#1f2328">Do I still understand</text>
<text x="351" y="348" font-size="17" font-weight="700" fill="#1f2328">my code</text>
<text x="351" y="396" font-size="30" font-weight="700" fill="#1f2328">5 entries</text>
<line x1="351" y1="414" x2="608" y2="414" stroke="#d8dee4"/>
<text x="351" y="440" font-size="14" fill="#59636e">1 trial on people, on learning</text>
<rect x="642" y="270" width="293" height="190" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="642" y="270" width="4" height="190" rx="2" fill="#6e7781"/>
<text x="660" y="298" font-size="12" font-weight="700" fill="#6e7781" letter-spacing="0.6">RESEARCH</text>
<text x="660" y="326" font-size="17" font-weight="700" fill="#1f2328">Studies of</text>
<text x="660" y="348" font-size="17" font-weight="700" fill="#1f2328">human review</text>
<text x="660" y="396" font-size="30" font-weight="700" fill="#1f2328">6 studies</text>
<line x1="660" y1="414" x2="917" y2="414" stroke="#d8dee4"/>
<text x="660" y="440" font-size="14" fill="#59636e">0 controlled tests of a tool</text>
</svg>